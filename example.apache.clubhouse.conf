<VirtualHost *:80>
	ServerName clubhouse.nz
    # and add clubhouse.nz to /etc/hosts - this way you can serve multiple local dev sites with ease

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html/clubhouse

    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}$1.php -f
    RewriteRule ^([^.]+)$ $1.php [L]

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
